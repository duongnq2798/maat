# Fly app for the public Guard Service. It is built from the agent's image (Dockerfile) and runs the guard's entry
# point instead of the agent's. Secrets (BASE_RPC_URL, MAAT_VAULT, MAAT_EXECUTOR, CDP_API_KEY_ID,
# CDP_API_KEY_SECRET) are set with `fly secrets set`; never CDP_WALLET_SECRET. Deploy: fly deploy -c fly.guard.toml
app = "maat-guard"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  GUARD_PORT = "8080"

# Replaces the image's CMD (the agent); the image's ENTRYPOINT (tini) still starts it and forwards signals.
[processes]
  app = "node --import tsx src/guard/main.ts"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  # One always-on machine: the rate limiter and the caches live in memory.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
