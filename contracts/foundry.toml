[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
hardfork = "base:Cobalt"
via_ir = true
optimizer = true
optimizer_runs = 200
# MarketCalendarVectors.t.sol reads the committed JSON vectors
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[fmt]
line_length = 110
