[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
hardfork = "base:Cobalt"
via_ir = true
optimizer = true
optimizer_runs = 200
# MarketCalendarVectors.t.sol reads the committed JSON vectors
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[fmt]
line_length = 110

# test/invariant: 32 runs of 512 calls take well under a minute. The handlers never revert, so a revert is a
# handler bug and fails the run. For a longer search: FOUNDRY_PROFILE=deep forge test --match-path "test/invariant/*"
[invariant]
runs = 32
depth = 512
fail_on_revert = true

[profile.deep.invariant]
runs = 256
depth = 1024
fail_on_revert = true
